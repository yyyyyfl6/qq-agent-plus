<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人格 · QQ Agent</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/skins.css">
  <script>
    /* 单独打开本页时也跟控制台同一套明暗（控制台把选择存在 localStorage）。嵌在控制台里时不走这里。 */
    (function () {
      try {
        var saved = localStorage.getItem('qqa-theme') || localStorage.getItem('qqa-theme-server') || '';
        var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var theme = saved === 'light' || saved === 'dark' ? saved : sys;
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* 保持 dark */ }
    })();
  </script>
</head>
<body class="personas-body"><main id="skins-page">
  <!-- 结构说明：这份 #skins-page 同时用于两处 —— 单独打开 /skins.html，以及控制台侧栏「人格」页
       （ui/skins-view.js 把它原样取进来）。所以这里只写一份；元素 id 与 skins.js / 测试一一对应，不要改名。
       页内跳转一律用按钮（data-jump），不用 #锚点：嵌在控制台里时锚点会改掉控制台的地址栏 hash。 -->
  <header class="personas-header">
    <a class="personas-back" href="/">← 控制台</a>
    <div class="personas-hero">
      <div class="personas-hero-copy">
        <h1>人格</h1>
        <p>一个机器人，多套人格：每套有自己的角色卡、模型和切换指令，对话、记忆与存档各自独立。管理员在聊天里发切换指令（如「切鱼」）即可换人。</p>
      </div>
      <label class="personas-master" title="开启后各会话按绑定的人格回复">
        <input id="skins-enabled" type="checkbox">
        <span class="personas-master-track"><span class="personas-master-thumb"></span></span>
        <span class="personas-master-label" id="skins-enabled-label">多人格未启用</span>
      </label>
    </div>
    <p id="skin-status" class="personas-status" role="status" aria-live="polite">加载中…</p>
  </header>

  <section id="personality-settings" class="personas-section">
    <div class="section-title">
      <div><h2>人格 <span class="personas-count" id="skins-count"></span></h2><p class="muted">点卡片上的「编辑」改名称、角色卡、模型与指令；「设为默认」决定还没绑定过的会话用谁。</p></div>
      <button id="skin-add" type="button" class="btn btn-primary" disabled>＋ 新增人格</button>
    </div>
    <div id="skins-list" class="personas-list"></div>
  </section>

  <section id="chat-settings" class="personas-section">
    <div class="section-title">
      <div><h2>会话</h2><p class="muted">每个群 / 私聊当前用哪个人格。改了下拉框后点「切换」生效；切换会结束当前对话线程。</p></div>
      <input id="skins-chat-filter" class="personas-filter" type="search" placeholder="筛选群号 / QQ…" aria-label="筛选会话">
    </div>
    <div id="skins-chats" class="personas-chats"></div>
    <p id="skin-switch-status" class="personas-inline-status" role="status" aria-live="polite"></p>
  </section>

  <form id="skins-form" class="personas-section">
    <details id="summary-settings" class="personas-advanced">
      <summary><span>切换与交接设置</span><span class="muted">默认人格、切换回执、交接摘要</span></summary>
      <div class="personas-advanced-body">
        <div class="personas-fields">
          <label>默认人格<select id="skins-default"></select></label>
          <label>切换回执<input id="skins-ack" placeholder="已切换到 {label}" maxlength="300"></label>
        </div>
        <label>通用切换指令（每行一条；如 <code>/skin</code>，后面跟人格 id）<textarea id="skins-prefixes" rows="2" aria-label="通用切换指令"></textarea></label>
        <div class="personas-divider"></div>
        <label class="check-label"><input id="skins-handoff" type="checkbox">切换时总结最近对话，交给接任人格（转述，不是亲历）</label>
        <div class="personas-fields">
          <label>总结提供商<select id="skins-summary-provider"></select></label>
          <label>总结模型<input id="skins-summary-model" list="summary-model-options" placeholder="deepseek-flash"><datalist id="summary-model-options"></datalist></label>
          <label>最近消息数<input id="skins-summary-recent" type="number" min="1" max="100"></label>
          <label>摘要最大字符数<input id="skins-summary-chars" type="number" min="120" max="4000"></label>
        </div>
        <p class="muted">自动选择会优先找提供该模型的提供商，没有就用全局 API。摘要失败仍会切换，并显示原因。</p>
        <div class="personas-save"><span class="muted" id="skins-dirty">改完点保存</span><button type="submit" class="btn btn-primary" id="skins-save" disabled>保存设置</button></div>
      </div>
    </details>
  </form>

  <dialog id="persona-dialog" aria-labelledby="persona-title">
    <form id="persona-form">
      <h2 id="persona-title">新增人格</h2>
      <label>人格名称<input id="persona-name" maxlength="200" required placeholder="例如：鲸鱼娘"></label>
      <label>角色卡<select id="persona-preset" required></select><span class="field-note">角色卡正文在 设置 → 人设 里写和管理。</span></label>
      <div class="personas-fields"><label>模型提供商<select id="persona-provider"></select></label><label>模型<input id="persona-model" list="persona-model-options" required placeholder="选择或输入模型 ID"><datalist id="persona-model-options"></datalist></label></div>
      <label>专属切换指令（每行一条，完整匹配）<textarea id="persona-commands" rows="3" placeholder="例如：切换鲸鱼娘&#10;/whale"></textarea></label>
      <p id="persona-error" class="personas-error" role="alert"></p>
      <div class="personas-actions"><button id="persona-cancel" type="button" class="btn">取消</button><button id="persona-save" type="submit" class="btn btn-primary">保存人格</button></div>
    </form>
  </dialog>
</main><script type="module" src="/skins.js"></script></body></html>
